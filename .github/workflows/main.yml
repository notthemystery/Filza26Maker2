name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y zip

      - name: Run script
        run: |
          chmod +x Filza26Maker.sh
          ./Filza26Maker.sh

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: "*.ipa"
