name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: sudo apt update -y && sudo apt install zip -y

      - name: Run
        run: chmod +x Filza26Maker.sh ./Filza26Maker.sh
          

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
             name: build
             path: *.ipa
